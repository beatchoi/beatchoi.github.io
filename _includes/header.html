<header class="mast">
  <div class="wrap mast-in">
    <a class="brand" href="{{ '/' | relative_url }}"><b>{{ site.title }}</b><span>{{ site.tagline }}</span></a>
    <button class="nav-toggle" type="button" aria-label="메뉴" aria-expanded="false" aria-controls="site-nav">
      <span></span><span></span>
    </button>
    <nav class="top" id="site-nav" aria-label="주요 메뉴">
      {% for item in site.data.navigation %}
      {% assign active = false %}
      {% if item.link == page.url %}{% assign active = true %}{% endif %}
      {% if item.link == '/blog/' and page.layout == 'post' %}{% assign active = true %}{% endif %}
      <a href="{{ item.link | relative_url }}"{% if active %} class="is-active"{% endif %}>{{ item.name }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
