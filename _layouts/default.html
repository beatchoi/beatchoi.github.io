<!DOCTYPE html>
<html lang="ko">
{% include head.html %}
<body class="layout-{{ layout.name | default: page.layout }}">
  <a class="skip" href="#main">본문으로</a>
  {% include header.html %}
  <main id="main">
    {{ content }}
  </main>
  {% unless page.hide_footer %}{% include footer.html %}{% endunless %}
  <script src="{{ '/assets/js/app.js' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M' }}" defer></script>
</body>
</html>
