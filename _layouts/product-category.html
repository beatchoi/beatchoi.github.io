---
layout: default
---
<div class="sheet sheet-sm"><div class="wrap"><header class="page-head">
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="sub">{{ page.subtitle }}</p>{% endif %}
  </header></div></div>
<section class="wrap page">
    <div class="prose">{{ content }}</div>
  {% assign sorted = site.products | sort: page.sort | reverse %}
  <ul class="works">
    {% for w in sorted %}
    <li>
      <a href="{{ w.url | relative_url }}">
        {% if w.image %}<img src="{{ w.image | relative_url }}" alt="" loading="lazy">{% endif %}
        <span class="w-t">{{ w.title }}</span>
        <span class="w-s">{{ w.subtitle }}</span>
      </a>
    </li>
    {% endfor %}
  </ul>
</section>
