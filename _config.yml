# Site Settings
title: What's Life Studio
tagline: 왓츠라이프 스튜디오
email: beat@whtls.com
description: >
  Unity로 산업의 문제를 실시간 3D로 옮겨 보고, 배운 것을 글과 수업 자료로 남기는 작업실.
author: 최윤석
baseurl: ""
url: https://beatchoi.github.io
permalink: pretty
future: true
lang: ko

paginate: 20
paginate_path: "/blog/page:num"

# Disqus 댓글은 사용하지 않습니다. 다시 켜려면 shortname 을 채우세요.
disqus:
  shortname:

plugins:
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - Files/*.zip
  - LICENSE.txt

sass:
  style: compressed
  sass_dir: _sass

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: page
  - scope:
      path: ""
      type: "posts"
    values:
      author: "최윤석"
      layout: post

markdown: kramdown
kramdown:
  highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

collections:
  products:
    output: true
    layout: product
